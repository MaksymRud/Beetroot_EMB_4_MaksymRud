CompileFlags:
  # Use compile_commands.json generated by:  pio run -e blackpill_f401cc -t compiledb
  CompilationDatabase: .
  Add: [-xc++, -std=gnu++17]

Diagnostics:
  UnusedIncludes: None
  Suppress:
    - pp_hash_error
  ClangTidy:
    Remove:
      - bugprone-reserved-identifier
      - cert-dcl37-c
      - cert-dcl51-cpp

Index:
  Background: Build
