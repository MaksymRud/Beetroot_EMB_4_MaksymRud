CompileFlags:
  # Use compile_commands.json generated by:  pio run -e blackpill_f401cc -t compiledb
  CompilationDatabase: .

Diagnostics:
  # Suppress warnings inside framework/vendor headers
  Suppress:
    - pp_hash_error
  UnusedIncludes: None
  # Suppress false positives from third-party SDK headers
  ClangTidy:
    Remove:
      - bugprone-reserved-identifier
      - cert-dcl37-c
      - cert-dcl51-cpp

Index:
  Background: Build
